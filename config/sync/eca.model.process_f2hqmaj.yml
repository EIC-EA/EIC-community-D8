    <bpmn2:process id="Process_f2HQmaJ" name="Inactive users 1 month" isExecutable="false" camunda:versionTag="v1">
      <bpmn2:documentation>During cron, this model switches the user context, queries a view to receive all user accounts that have never logged in and have been created more than 1 month ago and loops over all those users triggering an email.</bpmn2:documentation>
      <bpmn2:extensionElements>
        <camunda:properties>
          <camunda:property name="Tags" value="test models,views,loop,custom event,cron,switch user"/>
          <camunda:property name="Changelog v1" value="Initial version"/>
        </camunda:properties>
      </bpmn2:extensionElements>
      <bpmn2:startEvent id="Event_1up81dz" name="Cron" camunda:modelerTemplate="org.drupal.event.eca_base:eca_cron">
        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_base:eca_cron"/>
          </camunda:properties>
          <camunda:field name="frequency">
            <camunda:string>* * * * *</camunda:string>
          </camunda:field>
        </bpmn2:extensionElements>
        <bpmn2:outgoing>Flow_127rqxa</bpmn2:outgoing>
      </bpmn2:startEvent>
      <bpmn2:task id="Activity_08o1wo5" name="List inactive users" camunda:modelerTemplate="org.drupal.action.eca_views_query">
