eic_feature_toggle.settings:
  type: config_object
  label: 'EIC Feature Toggle settings'
  mapping:
    cron:
      type: mapping
      label: 'Cron operations'
      mapping:
        eic_statistics:
          type: boolean
          label: 'EIC Statistics cron'
        eic_groups_url_alias:
          type: boolean
          label: 'EIC Groups URL alias updates'
        eic_groups_approval_reminder:
          type: boolean
          label: 'EIC Groups approval reminders'
        eic_groups_invitation_reminder:
          type: boolean
          label: 'EIC Groups invitation reminders'
        eic_groups_solr_reindex:
          type: boolean
          label: 'EIC Groups Solr reindex'
        eic_flags:
          type: boolean
          label: 'EIC Flags timeout processing'
        eic_projects_cordis:
          type: boolean
          label: 'EIC Projects CORDIS sync'
        eic_events:
          type: boolean
          label: 'EIC Events sync'
        eic_subscription_digest:
          type: boolean
          label: 'EIC Subscription digest'
        eic_media_statistics:
          type: boolean
          label: 'EIC Media statistics'
    queue:
      type: mapping
      label: 'Queue workers'
      mapping:
        eic_message_notify_queue:
          type: boolean
          label: 'Message notify queue'
        eic_flags_notify_queue:
          type: boolean
          label: 'Flags notify queue'
        eic_groups_group_content_url_alias_update:
          type: boolean
          label: 'Group content URL alias update queue'
        eic_groups_group_content_search_api:
          type: boolean
          label: 'Group content search API queue'
        eic_projects_cordis_extraction_worker:
          type: boolean
          label: 'CORDIS extraction worker queue'
        subscription_digest:
          type: boolean
          label: 'Subscription digest queue'
    external:
      type: mapping
      label: 'External services'
      mapping:
        cordis_api:
          type: boolean
          label: 'CORDIS Data Extraction API'
        vod_cloudfront:
          type: boolean
          label: 'Video streaming (CloudFront)'
        smed_user_sync:
          type: boolean
          label: 'SME Dashboard user sync'
        rest_webservices:
          type: boolean
          label: 'Inbound REST endpoints'
        profile_enforcement:
          type: boolean
          label: 'Profile enforcement'
