eic_dashboards.homepage:
  path: '/dashboards'
  defaults:
    _title: 'EIC Community Management Dashboards'
    _controller: '\Drupal\eic_dashboards\Controller\HomepageDashboardsController::dashboardsHomepage'
  requirements:
    _role: 'sensitive'

eic_dashboards.homepage_cache_invalidate:
  path: '/dashboards/cache/invalidate'
  defaults:
    _title: 'Dashboards Cache Invalidate'
    _controller: '\Drupal\eic_dashboards\Controller\HomepageDashboardsController::invalidateCaches'
  requirements:
    _role: 'sensitive'
    _csrf_token: 'TRUE'

eic_dashboards.members:
  path: '/dashboards/members'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\MembersDashboardController::membersOverview'
    _title: 'Members dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.groups:
  path: '/dashboards/groups'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupGroupsDashboardController::page'
    _title: 'Groups dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.events:
  path: '/dashboards/events'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupEventsDashboardController::page'
    _title: 'Events dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.organisations:
  path: '/dashboards/organisations'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupOrganisationsDashboardController::page'
    _title: 'Organisations dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.projects:
  path: '/dashboards/projects'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupProjectsDashboardController::page'
    _title: 'Projects dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.content.documents:
  path: '/dashboards/content/documents'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\ContentDocumentsDashboardController::page'
    _title: 'Documents content dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.content.stories:
  path: '/dashboards/content/stories'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\ContentStoriesDashboardController::page'
    _title: 'Stories content dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.content.discussions:
  path: '/dashboards/content/discussions'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\ContentDiscussionsDashboardController::page'
    _title: 'Discussions content dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.listings.activity_report:
  path: '/dashboards/listings/activity-report'
  defaults:
    _form: '\Drupal\eic_dashboards\Form\ActivityReportForm'
    _title: 'Activity report'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.dashboard:
  path: '/group/{group}/dashboard'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\IndividualGroupDashboardController::page'
    _title_callback: '\Drupal\eic_dashboards\Controller\IndividualGroupDashboardController::title'
  requirements:
    _custom_access: '\Drupal\eic_dashboards\Controller\IndividualGroupDashboardController::access'
  options:
    parameters:
      group:
        type: 'entity:group'
