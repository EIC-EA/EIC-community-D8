eic_dashboards.homepage:
  path: '/dashboards'
  defaults:
    _title: 'EIC Community Management Dashboards'
    _controller: '\Drupal\eic_dashboards\Controller\HomepageDashboardsController:dashboardsHomepage'
  requirements:
    _role: 'sensitive'

eic_dashboards.members:
  path: '/dashboards/members'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\MembersDashboardController::membersOverview'
    _title: 'Members dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.groups:
  path: '/dashboards/groups'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupGroupsDashboardController::page'
    _title: 'Groups dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.events:
  path: '/dashboards/events'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupEventsDashboardController::page'
    _title: 'Events dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.organisations:
  path: '/dashboards/organisations'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupOrganisationsDashboardController::page'
    _title: 'Organisations dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.group.projects:
  path: '/dashboards/projects'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\GroupProjectsDashboardController::page'
    _title: 'Projects dashboard'
  requirements:
    _role: 'sensitive'

eic_dashboards.content.documents:
  path: '/dashboards/content/documents'
  defaults:
    _controller: '\Drupal\eic_dashboards\Controller\ContentDocumentsDashboardController::page'
    _title: 'Documents content dashboard'
