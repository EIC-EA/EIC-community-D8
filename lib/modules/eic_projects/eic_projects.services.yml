services:
  #Important for autowiring services.
  GuzzleHttp\Client:
    alias: 'http_client'
  Drupal\Core\Entity\EntityTypeManagerInterface:
    alias: 'entity_type.manager'

  eic_projects.data_extraction:
    class: Drupal\eic_projects\CordisExtractionService
    arguments: ['@http_client', '@state']
  eic_projects.project_migration:
    class: Drupal\eic_projects\MigrationCordisProject
    arguments: ['@file_system', '@state', '@entity_type.manager']
  eic_projects.post_row_migration_subscriber:
    class: Drupal\eic_projects\EventSubscriber\ProjectStakeholderMigrateSubscriber
    tags:
      - { name: 'event_subscriber' }
  eic_projects.ftp_search:
    class: Drupal\eic_projects\Service\FundingTenderPortalSearch
    autowire: true
