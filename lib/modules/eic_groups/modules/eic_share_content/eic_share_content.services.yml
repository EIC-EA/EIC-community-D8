services:
  eic_share_content.share_manager:
    class: 'Drupal\eic_share_content\Service\ShareManager'
    arguments: [ '@eic_groups.helper', '@entity_type.manager', '@plugin.manager.group_content_enabler', '@group.membership_loader', '@group_flex.group', '@eic_messages.message_bus', '@message_subscribe.subscribers', '@current_user' ]

  eic_share_content.solr_document_decorator:
    class: 'Drupal\eic_share_content\Hooks\SolrDocumentDecorator'
    arguments: ['@eic_share_content.share_manager', '@entity_type.manager']

  eic_share_content.solr_document_subscriber:
    class: 'Drupal\eic_share_content\EventSubscriber\SolrDocumentSubscriber'
    arguments: ['@eic_share_content.solr_document_decorator']
    tags:
      - { name: event_subscriber }
